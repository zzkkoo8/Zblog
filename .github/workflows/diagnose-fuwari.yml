name: Diagnose Fuwari baseline

on:
  push:
    branches: [feat/bootstrap-zblog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test previous Fuwari commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/saicaca/fuwari.git /tmp/fuwari
          git -C /tmp/fuwari checkout 415fb97054e57bb85da86e2ca4ea4a1ae7266219
          cd /tmp/fuwari
          corepack enable
          corepack prepare pnpm@9.14.4 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          test -f dist/index.html
