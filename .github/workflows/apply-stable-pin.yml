name: Apply verified Fuwari pin

on:
  push:
    branches: [feat/bootstrap-zblog]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-zblog
          fetch-depth: 0
      - name: Pin verified Fuwari commit
        shell: bash
        run: |
          set -euo pipefail
          OLD="6d39b0dec41282e7852e23e032998a5789abee28"
          NEW="415fb97054e57bb85da86e2ca4ea4a1ae7266219"
          grep -RIl "$OLD" .github/workflows/bootstrap.yml docs/superpowers | while read -r file; do
            sed -i "s/$OLD/$NEW/g" "$file"
          done
          if git diff --quiet; then
            echo "Verified pin already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bootstrap.yml docs/superpowers
          git commit -m "fix: pin verified Fuwari baseline"
          git push origin HEAD:feat/bootstrap-zblog
