name: Format probe

on:
  push:
    branches:
      - feat/giscus-comments

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm prettier --write 'src/pages/posts/[...slug]/_components/GiscusComments.astro'
          git diff -- 'src/pages/posts/[...slug]/_components/GiscusComments.astro'
