name: Bootstrap Zblog

on:
  push:
    branches:
      - main
      - feat/bootstrap-zblog
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Zblog
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stop when already initialized
        id: guard
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
            echo "Zblog is already initialized."
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Fuwari scaffold
        if: steps.guard.outputs.initialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          FUWARI_COMMIT="6d39b0dec41282e7852e23e032998a5789abee28"
          git clone --filter=blob:none https://github.com/saicaca/fuwari.git /tmp/fuwari
          git -C /tmp/fuwari checkout "$FUWARI_COMMIT"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='docs/' \
            --exclude='README.md' \
            --exclude='CONTRIBUTING.md' \
            /tmp/fuwari/ ./

          rm -rf src/content/posts
          mkdir -p src/content/posts

          python3 <<'PY'
          from pathlib import Path

          p = Path('astro.config.mjs')
          text = p.read_text()
          text = text.replace('site: "https://fuwari.vercel.app/",', 'site: "https://zzkkoo8.github.io",')
          text = text.replace('base: "/",', 'base: "/Zblog",')
          p.write_text(text)
          PY

          cat > src/config.ts <<'EOF'
          import type {
            ExpressiveCodeConfig,
            LicenseConfig,
            NavBarConfig,
            ProfileConfig,
            SiteConfig,
          } from "./types/config";
          import { LinkPreset } from "./types/config";

          export const siteConfig: SiteConfig = {
            title: "Zblog",
            subtitle: "个人技术博客",
            lang: "zh_CN",
            themeColor: {
              hue: 250,
              fixed: false,
            },
            banner: {
              enable: false,
              src: "assets/images/demo-banner.png",
              position: "center",
              credit: {
                enable: false,
                text: "",
                url: "",
              },
            },
            toc: {
              enable: true,
              depth: 2,
            },
            favicon: [],
          };

          export const navBarConfig: NavBarConfig = {
            links: [
              LinkPreset.Home,
              LinkPreset.Archive,
              LinkPreset.About,
              {
                name: "Zwiki",
                url: "https://zwiki.gitbook.io/zwiki-docs/",
                external: true,
              },
              {
                name: "GitHub",
                url: "https://github.com/zzkkoo8/Zblog",
                external: true,
              },
            ],
          };

          export const profileConfig: ProfileConfig = {
            name: "zzkkoo8",
            bio: "记录技术实践、故障复盘与工程思考。",
            links: [
              {
                name: "GitHub",
                icon: "fa6-brands:github",
                url: "https://github.com/zzkkoo8/Zblog",
              },
              {
                name: "Zwiki",
                icon: "material-symbols:menu-book-outline",
                url: "https://zwiki.gitbook.io/zwiki-docs/",
              },
            ],
          };

          export const licenseConfig: LicenseConfig = {
            enable: false,
            name: "",
            url: "",
          };

          export const expressiveCodeConfig: ExpressiveCodeConfig = {
            theme: "github-dark",
          };
          EOF

          cat > src/content/spec/about.md <<'EOF'
          # 关于 Zblog

          Zblog 是一个个人技术博客，用来记录技术实践、故障复盘、方案分析和工程思考。

          可长期复用的命令、操作手册与故障排查知识统一沉淀到 [Zwiki](https://zwiki.gitbook.io/zwiki-docs/)。

          博客源码和文章托管在 [GitHub](https://github.com/zzkkoo8/Zblog)，GitHub `main` 是唯一事实源。
          EOF

          cat > src/content/posts/about-zblog.md <<'EOF'
          ---
          title: "Zblog：个人技术博客"
          published: 2026-09-03
          description: "Zblog 的定位、内容边界与维护方式。"
          tags: [Zblog, Blog]
          category: "随笔"
          lang: "zh_CN"
          draft: false
          ---

          Zblog 用于记录技术实践、故障复盘、方案分析和工程思考。

          ## Zblog 与 Zwiki

          两者使用同一种维护原则：**GitHub 是唯一事实源**。

          - **Zblog**：适合阅读的技术文章、实践总结、教程和思考。
          - **Zwiki**：可长期复用的命令、操作手册、知识条目和故障排查手册。

          当博客内容涉及完整操作手册时，优先链接到 [Zwiki](https://zwiki.gitbook.io/zwiki-docs/)，避免两边维护重复内容。

          ## 发布流程

          ```text
          ChatGPT / Codex / 人工
                    ↓
              GitHub Markdown
                    ↓
              GitHub Actions
                    ↓
                Astro / Fuwari
                    ↓
               GitHub Pages
          ```

          后续文章统一维护在 `src/content/posts/`。
          EOF

          cat > AGENTS.md <<'EOF'
          # Zblog Agent Rules

          ## Source of truth

          - GitHub `main` is the single source of truth (SSOT).
          - Do not maintain a second authoritative copy of posts outside this repository.

          ## Content

          - Blog posts live in `src/content/posts/`.
          - Zblog is for technical articles, tutorials, retrospectives, solution analysis and engineering notes.
          - Reusable commands, runbooks and troubleshooting manuals belong in Zwiki; link to Zwiki instead of duplicating them here.
          - Never commit passwords, API keys, tokens, customer data or other sensitive information.

          ## Changes

          - Keep each post focused on one topic.
          - Preserve valid frontmatter and use `YYYY-MM-DD` for `published` / `updated` dates.
          - Theme, dependency or build configuration changes require `pnpm check` and `pnpm build` before merge.
          - Prefer small changes and do not upgrade Fuwari/Astro dependencies as part of unrelated article edits.
          EOF

          cat > README.md <<'EOF'
          # Zblog

          个人技术博客，基于 [Fuwari](https://github.com/saicaca/fuwari) + [Astro](https://astro.build/) 构建。

          - Blog: <https://zzkkoo8.github.io/Zblog/>
          - Zwiki: <https://zwiki.gitbook.io/zwiki-docs/>
          - GitHub `main` 是唯一事实源（SSOT）。

          ## 写文章

          文章统一放在：

          ```text
          src/content/posts/
          ```

          Frontmatter 示例：

          ```yaml
          ---
          title: "文章标题"
          published: 2026-09-03
          description: "文章摘要"
          tags: [Linux, Ubuntu]
          category: "Linux"
          lang: "zh_CN"
          draft: false
          ---
          ```

          ## 本地验证

          ```bash
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          ```

          ## 发布

          合并到 `main` 后由 GitHub Actions 自动构建并发布到 GitHub Pages。
          EOF

          mkdir -p .github/workflows
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 9.14.4
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: pnpm
                - run: pnpm install --frozen-lockfile
                - run: pnpm check
                - run: pnpm build
          EOF

          cat > .github/workflows/deploy.yml <<'EOF'
          name: Deploy to GitHub Pages

          on:
            push:
              branches: [main]
            workflow_dispatch:

          permissions:
            contents: read
            pages: write
            id-token: write

          concurrency:
            group: pages
            cancel-in-progress: false

          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: pnpm/action-setup@v4
                  with:
                    version: 9.14.4
                    run_install: false
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: pnpm
                - uses: actions/configure-pages@v5
                - run: pnpm install --frozen-lockfile
                - run: pnpm check
                - run: pnpm build
                - uses: actions/upload-pages-artifact@v3
                  with:
                    path: ./dist

            deploy:
              environment:
                name: github-pages
              runs-on: ubuntu-latest
              needs: build
              steps:
                - name: Deploy to GitHub Pages
                  id: deployment
                  uses: actions/deploy-pages@v4
          EOF

      - name: Verify generated site
        if: steps.guard.outputs.initialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.14.4 --activate
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
          test -f dist/index.html

      - name: Commit verified scaffold
        if: steps.guard.outputs.initialized == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap Zblog with Fuwari"
          git push origin HEAD:"${GITHUB_REF_NAME}"
